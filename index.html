    <meta name="description" content="Serverless, peer-to-peer (P2P) mobile-first web app of the traditional Indian 5x5 paper-and-pen Bingo game." />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>" />

    <!-- Google Fonts: Outfit & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Outfit', 'sans-serif'],
            },

              bingo: {
                bg: '#0b0f19',

                '0%': { transform: 'scale(0.8)' },

                '100%': { transform: 'scale(1)' },

            }
          }

    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Canvas Confetti CDN -->

    <!-- Babel Standalone for in-browser JSX parsing -->

    <style>
      body {
        background-color: #0b0f19;
        font-family: 'Outfit', sans-serif;
        color: #f3f4f6;
      }
      .glass-panel {
        background: rgba(21, 28, 46, 0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

        text-shadow: 0 0 10px rgba(245, 158, 11, 0.8), 0 0 20px rgba(245, 158, 11, 0.4);
      }

  </head>
  <body class="bg-[#0b0f19] text-white min-h-screen antialiased select-none overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useCallback, useRef } = React;

      // --- 1. GAME ENGINE & RULES ---
      const BINGO_LETTERS = ['B', 'I', 'N', 'G', 'O'];

      const WINNING_LINE_PATTERNS = [
        // 5 Rows
        { id: 'row-0', indices: [0, 1, 2, 3, 4], type: 'row', index: 0 },
        { id: 'row-1', indices: [5, 6, 7, 8, 9], type: 'row', index: 1 },
        { id: 'row-2', indices: [10, 11, 12, 13, 14], type: 'row', index: 2 },
        { id: 'row-3', indices: [15, 16, 17, 18, 19], type: 'row', index: 3 },
        { id: 'row-4', indices: [20, 21, 22, 23, 24], type: 'row', index: 4 },
        // 5 Columns
        { id: 'col-0', indices: [0, 5, 10, 15, 20], type: 'col', index: 0 },
        { id: 'col-1', indices: [1, 6, 11, 16, 21], type: 'col', index: 1 },
        { id: 'col-2', indices: [2, 7, 12, 17, 22], type: 'col', index: 2 },
        { id: 'col-3', indices: [3, 8, 13, 18, 23], type: 'col', index: 3 },
        { id: 'col-4', indices: [4, 9, 14, 19, 24], type: 'col', index: 4 },
        // 2 Diagonals
        { id: 'diag-main', indices: [0, 6, 12, 18, 24], type: 'diag', index: 0 },
        { id: 'diag-anti', indices: [4, 8, 12, 16, 20], type: 'diag', index: 1 },
      ];

      function generateRandomGrid() {
        const numbers = Array.from({ length: 25 }, (_, i) => i + 1);
        for (let i = numbers.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [numbers[i], numbers[j]] = [numbers[j], numbers[i]];
        }
        return numbers;
      }

      function isValidGrid(grid) {
        if (!Array.isArray(grid) || grid.length !== 25) return false;
        const numSet = new Set(grid.filter(n => n !== null && n !== undefined && n >= 1 && n <= 25));
        return numSet.size === 25;
      }

      function evaluateGrid(grid, crossedNumbers) {
        if (!grid || grid.length !== 25) {
          return { completedLines: [], count: 0, letters: [], isWin: false };
        }
        const crossedSet = crossedNumbers instanceof Set ? crossedNumbers : new Set(crossedNumbers);
        const completedLines = WINNING_LINE_PATTERNS.filter(pattern =>
          pattern.indices.every(idx => grid[idx] && crossedSet.has(grid[idx]))
        );
        const count = completedLines.length;
        const unlockedLetters = BINGO_LETTERS.slice(0, Math.min(5, count));
        return { completedLines, count, letters: unlockedLetters, isWin: count >= 5 };
      }

      function getSmartAIMove(aiGrid, crossedNumbers) {
        const crossedSet = crossedNumbers instanceof Set ? crossedNumbers : new Set(crossedNumbers);
        const uncrossed = aiGrid
          .map((num, idx) => (num && !crossedSet.has(num) ? { num, idx } : null))
          .filter(Boolean);

        if (uncrossed.length === 0) return null;

        let bestScore = -1;
        let bestMove = uncrossed[0].num;

        for (const { num, idx } of uncrossed) {
          let score = 0;
          for (const pattern of WINNING_LINE_PATTERNS) {
            if (pattern.indices.includes(idx)) {
              const crossedInLine = pattern.indices.filter(i => crossedSet.has(aiGrid[i])).length;
              score += Math.pow(2, crossedInLine);
            }
          }
          if (score > bestScore) {
            bestScore = score;
            bestMove = num;
          }
        }
        return bestMove;
      }

      // --- 2. WEB AUDIO API SYNTHESIZER ---
      let audioCtx = null;
      let isMutedGlobal = false;

      function getAudioContext() {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) audioCtx = new AudioContextClass();
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        return audioCtx;
      }

      function playPopSound() {
        if (isMutedGlobal) return;
        const ctx = getAudioContext();
        if (!ctx) return;
        try {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(400, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.05);
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.05);
        } catch(e){}
      }

      function playCrossSound() {
        if (isMutedGlobal) return;
        const ctx = getAudioContext();
        if (!ctx) return;
        try {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(150, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.12);
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.12);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.12);
        } catch(e){}
      }

      function playLineChimeSound() {
        if (isMutedGlobal) return;
        const ctx = getAudioContext();
        if (!ctx) return;
        try {
          const notes = [523.25, 659.25, 783.99, 1046.5];
          notes.forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.06);
            gain.gain.setValueAtTime(0.2, ctx.currentTime + idx * 0.06);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.06 + 0.2);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + idx * 0.06);
            osc.stop(ctx.currentTime + idx * 0.06 + 0.2);
          });
        } catch(e){}
      }

      function playVictorySound() {
        if (isMutedGlobal) return;
        const ctx = getAudioContext();
        if (!ctx) return;
        try {
          const notes = [
            { f: 523.25, d: 0.15, delay: 0 },
            { f: 659.25, d: 0.15, delay: 0.15 },
            { f: 783.99, d: 0.15, delay: 0.3 },
            { f: 1046.5, d: 0.5, delay: 0.45 },
          ];
          notes.forEach(({ f, d, delay }) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, ctx.currentTime + delay);
            gain.gain.setValueAtTime(0.3, ctx.currentTime + delay);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + d);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + delay);
            osc.stop(ctx.currentTime + delay + d);
          });
        } catch(e){}
      }

      function playDefeatSound() {
        if (isMutedGlobal) return;
        const ctx = getAudioContext();
        if (!ctx) return;
        try {
          const notes = [400, 350, 300, 250];
          notes.forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.12);
            gain.gain.setValueAtTime(0.15, ctx.currentTime + idx * 0.12);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.12 + 0.2);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + idx * 0.12);
            osc.stop(ctx.currentTime + idx * 0.12 + 0.2);
          });
        } catch(e){}
      }

      // --- 3. COMPONENTS ---
      function BingoHeader({ playerLetters = [], opponentLettersCount = 0, isMyTurn = false, gamePhase = 'setup', gameMode = 'ai', opponentName = 'Opponent', isMuted = false, onToggleMute, onOpenRoomModal }) {
        return (
          <div className="w-full max-w-lg mx-auto flex flex-col gap-3 p-4 glass-panel rounded-2xl border border-slate-700/50 shadow-2xl mb-4">
            <div className="flex items-center justify-between border-b border-slate-700/40 pb-3">
              <div className="flex items-center gap-2">
                <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-amber-500 to-yellow-300 flex items-center justify-center font-black text-slate-950 text-xl shadow-lg shadow-amber-500/20">
                  🎯
                </div>
                <div>
                  <h1 className="font-extrabold text-lg text-white tracking-wide leading-none flex items-center gap-1.5">
                    INDIAN <span className="text-amber-400">BINGO</span>
                  </h1>
                  <span className="text-[10px] text-slate-400 font-medium uppercase tracking-wider">5x5 Paper & Pen P2P</span>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <button
                  onClick={onOpenRoomModal}
                  className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700/80 border border-slate-700 text-xs font-semibold text-slate-300 transition"
                >
                  {gameMode === 'ai' ? <span>🤖 VS AI</span> : <span>📡 P2P Room</span>}
                </button>
                <button
                  onClick={onToggleMute}
                  className="p-2 rounded-lg bg-slate-800/80 hover:bg-slate-700/80 border border-slate-700 text-slate-300 hover:text-white transition"
                >
                  {isMuted ? '🔇' : '🔊'}
                </button>
              </div>
            </div>

            <div className="flex justify-between items-center px-1">
              <div className="flex items-center gap-2 w-full justify-center">
                {BINGO_LETTERS.map((letter) => {
                  const isUnlocked = playerLetters.includes(letter);
                  return (
                    <div
                      key={letter}
                      className={`relative flex-1 max-w-[64px] aspect-square rounded-xl flex items-center justify-center font-black text-2xl sm:text-3xl transition-all duration-300 ${
                        isUnlocked
                          ? 'bg-gradient-to-b from-amber-400 via-amber-500 to-amber-600 text-slate-950 scale-105 shadow-lg shadow-amber-500/50 ring-2 ring-amber-300 animate-pop'
                          : 'bg-slate-800/60 text-slate-600 border border-slate-700/50'
                      }`}
                    >
                      <span>{letter}</span>
                    </div>
                  );
                })}
              </div>
            </div>

            {gamePhase === 'playing' && (
              <div className="flex items-center justify-between bg-slate-900/60 px-3 py-2 rounded-xl border border-slate-800/80 text-xs">
                <div className="flex items-center gap-2">
                  <div className={`w-2.5 h-2.5 rounded-full ${isMyTurn ? 'bg-emerald-400 animate-ping' : 'bg-slate-500'}`} />
                  <span className={`font-bold ${isMyTurn ? 'text-emerald-400 text-sm' : 'text-slate-400'}`}>
                    {isMyTurn ? '👉 YOUR TURN! Select a number' : `⏳ ${opponentName}'s turn...`}
                  </span>
                </div>
                <div className="flex items-center gap-1.5 text-slate-400">
                  <span className="text-[11px] font-medium">{opponentName}:</span>
                  <div className="flex gap-0.5 font-extrabold text-xs tracking-widest">
                    {BINGO_LETTERS.map((letter, idx) => (
                      <span key={letter} className={idx < opponentLettersCount ? 'text-amber-400 font-black' : 'text-slate-600'}>
                        {letter}
                      </span>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      function BingoGrid({ grid = [], crossedNumbers = new Set(), completedLines = [], gamePhase = 'setup', isMyTurn = false, selectedSetupIdx = null, onCellClick, lastCrossedNumber }) {
        const crossedSet = crossedNumbers instanceof Set ? crossedNumbers : new Set(crossedNumbers);

        const getLineCoordinates = (pattern) => {
          if (pattern.type === 'row') {
            const y = (pattern.index + 0.5) * 20;
            return { x1: '4%', y1: `${y}%`, x2: '96%', y2: `${y}%` };
          }
          if (pattern.type === 'col') {
            const x = (pattern.index + 0.5) * 20;
            return { x1: `${x}%`, y1: '4%', x2: `${x}%`, y2: '96%' };
          }
          if (pattern.id === 'diag-main') return { x1: '6%', y1: '6%', x2: '94%', y2: '94%' };
          if (pattern.id === 'diag-anti') return { x1: '94%', y1: '6%', x2: '6%', y2: '94%' };
          return { x1: '0%', y1: '0%', x2: '0%', y2: '0%' };
        };

        return (
          <div className="relative w-full max-w-lg mx-auto aspect-square p-2 bg-slate-900/90 rounded-2xl border-2 border-slate-800 shadow-2xl overflow-hidden">
            <div className="grid grid-cols-5 grid-rows-5 gap-1.5 w-full h-full">
              {Array.from({ length: 25 }).map((_, idx) => {
                const val = grid[idx];
                const isCrossed = val && crossedSet.has(val);
                const isSelectedForSetup = gamePhase === 'setup' && selectedSetupIdx === idx;
                const isJustCrossed = val && lastCrossedNumber === val;

                return (
                  <button
                    key={idx}
                    onClick={() => onCellClick(idx, val)}
                    disabled={gamePhase === 'playing' && (!isMyTurn || isCrossed || !val)}
                    className={`relative flex items-center justify-center rounded-xl font-black text-xl sm:text-2xl md:text-3xl transition-all duration-200 select-none overflow-hidden ${
                      gamePhase === 'setup'
                        ? isSelectedForSetup
                          ? 'bg-amber-500 text-slate-950 ring-4 ring-amber-300 scale-95 z-10 shadow-lg shadow-amber-500/40'
                          : val
                          ? 'bg-slate-800 hover:bg-slate-700 text-white border border-slate-700/80'
                          : 'bg-slate-950/80 hover:bg-slate-800/60 text-slate-600 border border-dashed border-slate-700'
                        : isCrossed
                        ? 'bg-slate-950/90 text-slate-500 border border-slate-900 shadow-inner'
                        : isMyTurn && val
                        ? 'bg-slate-800 hover:bg-amber-500/20 hover:border-amber-400/80 text-white border border-slate-700 hover:scale-[1.03] cursor-pointer shadow-md'
                        : 'bg-slate-800/80 text-slate-300 border border-slate-700/50 opacity-90'
                    }`}
                  >
                    <span className={`relative z-10 ${isCrossed ? 'line-through text-slate-600 opacity-60' : ''}`}>
                      {val !== null && val !== undefined ? val : idx + 1}
                    </span>
                    {isCrossed && (
                      <div className={`absolute inset-0 flex items-center justify-center pointer-events-none z-20 ${isJustCrossed ? 'animate-stamp' : ''}`}>
                        <span className="font-black text-4xl sm:text-5xl text-red-500/90 drop-shadow-[0_0_12px_rgba(239,68,68,0.8)] select-none">
                          ✕
                        </span>
                      </div>
                    )}
                  </button>
                );
              })}
            </div>

            {completedLines.length > 0 && (
              <svg className="absolute inset-0 w-full h-full pointer-events-none z-30 p-2">
                <defs>
                  <linearGradient id="lineGlow" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stopColor="#f59e0b" />
                    <stop offset="50%" stopColor="#fbbf24" />
                    <stop offset="100%" stopColor="#10b981" />
                  </linearGradient>
                </defs>
                {completedLines.map((pattern) => {
                  const coords = getLineCoordinates(pattern);
                  return (
                    <line
                      key={pattern.id}
                      x1={coords.x1}
                      y1={coords.y1}
                      x2={coords.x2}
                      y2={coords.y2}
                      stroke="url(#lineGlow)"
                      strokeWidth="7"
                      strokeLinecap="round"
                      className="transition-all duration-500 opacity-90 animate-pulse"
                    />
                  );
                })}
              </svg>
            )}
          </div>
        );
      }

      function SetupPalette({ grid = [], selectedIdx = 0, onRandomize, onClear, onSelectNumberForCell, onReady, isReady, isWaitingForPeer }) {
        const placedNumbers = new Set(grid.filter((n) => n !== null && n !== undefined));
        const remainingNumbers = Array.from({ length: 25 }, (_, i) => i + 1).filter(n => !placedNumbers.has(n));
        const filledCount = placedNumbers.size;
        const isComplete = isValidGrid(grid);

        return (
          <div className="w-full max-w-lg mx-auto flex flex-col gap-3 p-4 glass-panel rounded-2xl border border-slate-700/50 shadow-xl mt-4">
            <div className="flex flex-wrap items-center justify-between gap-2 border-b border-slate-700/40 pb-3">
              <div>
                <h3 className="font-bold text-sm text-white">Board Setup</h3>
                <p className="text-xs text-slate-400">
                  {filledCount}/25 slots placed {isComplete ? '(Complete!)' : '- Tap slot or choose below'}
                </p>
              </div>
              <div className="flex items-center gap-2">
                <button
                  onClick={onRandomize}
                  className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/40 font-semibold text-xs transition active:scale-95"
                >
                  🎲 Randomize
                </button>
                <button
                  onClick={onClear}
                  className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 font-semibold text-xs transition active:scale-95"
                >
                  🗑️ Clear
                </button>
              </div>
            </div>

            {!isComplete && (
              <div className="flex flex-col gap-1.5">
                <span className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">
                  Tap number for slot #{selectedIdx + 1}:
                </span>
                <div className="flex flex-wrap gap-1.5">
                  {remainingNumbers.map((num) => (
                    <button
                      key={num}
                      onClick={() => onSelectNumberForCell(num)}
                      className="w-8 h-8 rounded-lg bg-slate-800 hover:bg-amber-500 hover:text-slate-950 border border-slate-700/70 text-slate-200 font-bold text-sm transition active:scale-95 flex items-center justify-center shadow-sm"
                    >
                      {num}
                    </button>
                  ))}
                </div>
              </div>
            )}

            <button
              onClick={onReady}
              disabled={!isComplete || isWaitingForPeer}
              className={`w-full py-3.5 px-4 rounded-xl font-extrabold text-base flex items-center justify-center gap-2 transition-all duration-300 shadow-lg ${
                isWaitingForPeer
                  ? 'bg-amber-500/30 text-amber-300 border border-amber-500/40 animate-pulse cursor-wait'
                  : isComplete
                  ? 'bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 shadow-emerald-500/25 active:scale-95 cursor-pointer ring-2 ring-emerald-300'
                  : 'bg-slate-800 text-slate-500 border border-slate-700 cursor-not-allowed'
              }`}
            >
              {isWaitingForPeer ? 'WAITING FOR OPPONENT TO READY UP...' : isReady ? '▶ READY! START GAME' : 'READY (FILL ALL 25 SLOTS)'}
            </button>
          </div>
        );
      }

      function RoomModal({ isOpen, onClose, onSelectMode, roomId, connectionStatus, onHostRoom, onJoinRoom, initialRoomCode }) {
        const [activeTab, setActiveTab] = useState('host');
        const [joinCodeInput, setJoinCodeInput] = useState(initialRoomCode || '');
        const [copied, setCopied] = useState(false);

        useEffect(() => {
          if (initialRoomCode) {
            setJoinCodeInput(initialRoomCode);
            setActiveTab('join');
          }
        }, [initialRoomCode]);

        if (!isOpen) return null;

        const handleCopyLink = () => {
          if (!roomId) return;
          const url = `${window.location.origin}${window.location.pathname}?room=${roomId}`;
          navigator.clipboard.writeText(url);
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        };

        const handleJoinSubmit = (e) => {
          e.preventDefault();
          if (joinCodeInput.trim()) {
            onJoinRoom(joinCodeInput.trim().toUpperCase());
          }
        };

        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
            <div className="relative w-full max-w-md bg-slate-900 border border-slate-700/80 rounded-2xl p-6 shadow-2xl">
              <button onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-white">✕</button>
              <h2 className="font-extrabold text-xl text-white mb-4">Multiplayer & Game Mode</h2>

              <div className="grid grid-cols-3 gap-1 bg-slate-950/70 p-1.5 rounded-xl border border-slate-800 mb-6">
                <button onClick={() => setActiveTab('host')} className={`py-2 text-xs font-bold rounded-lg ${activeTab === 'host' ? 'bg-amber-500 text-slate-950' : 'text-slate-400'}`}>Host Game</button>
                <button onClick={() => setActiveTab('join')} className={`py-2 text-xs font-bold rounded-lg ${activeTab === 'join' ? 'bg-amber-500 text-slate-950' : 'text-slate-400'}`}>Join Room</button>
                <button onClick={() => setActiveTab('ai')} className={`py-2 text-xs font-bold rounded-lg ${activeTab === 'ai' ? 'bg-amber-500 text-slate-950' : 'text-slate-400'}`}>VS AI</button>
              </div>

              {activeTab === 'host' && (
                <div>
                  {!roomId ? (
                    <button onClick={onHostRoom} className="w-full py-3.5 rounded-xl bg-gradient-to-r from-amber-500 to-yellow-400 text-slate-950 font-black text-sm shadow-lg">CREATE MULTIPLAYER ROOM</button>
                  ) : (
                    <div className="flex flex-col gap-3 p-4 bg-slate-950/60 rounded-xl border border-slate-800 text-center">
                      <span className="text-xs text-slate-400 font-semibold uppercase">Room Code</span>
                      <div className="font-black text-3xl text-amber-400 tracking-widest">{roomId}</div>
                      <p className="text-xs text-emerald-400">{connectionStatus === 'connected' ? 'Peer Connected!' : 'Waiting for guest player to join...'}</p>
                      <button onClick={handleCopyLink} className="py-2 bg-slate-800 hover:bg-slate-700 text-xs font-bold rounded-lg">
                        {copied ? '✓ Invite Link Copied!' : '📋 Copy Invite Link'}
                      </button>
                    </div>
                  )}
                </div>
              )}

              {activeTab === 'join' && (
                <form onSubmit={handleJoinSubmit} className="flex flex-col gap-4">
                  <input
                    type="text"
                    placeholder="Enter Room Code (e.g. BINGO-4921)"
                    value={joinCodeInput}
                    onChange={(e) => setJoinCodeInput(e.target.value.toUpperCase())}
                    className="w-full px-4 py-3 bg-slate-950 border border-slate-700 rounded-xl text-amber-400 font-black text-center text-lg uppercase focus:outline-none focus:border-amber-400"
                  />
                  <button type="submit" disabled={!joinCodeInput.trim()} className="w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black rounded-xl">
                    CONNECT & JOIN GAME
                  </button>
                </form>
              )}

              {activeTab === 'ai' && (
                <div className="text-center flex flex-col gap-4">
                  <p className="text-xs text-slate-400">Play instantly offline against the smart computer AI bot.</p>
                  <button onClick={() => { onSelectMode('ai'); onClose(); }} className="w-full py-3.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black rounded-xl">
                    🤖 START VS AI GAME
                  </button>
                </div>
              )}
            </div>
          </div>
        );
      }

      function GameOverModal({ isOpen, isWinner, winnerName = 'Winner', myLinesCount = 0, opponentLinesCount = 0, totalTurns = 0, onRematch, onMainMenu }) {
        useEffect(() => {
          if (isOpen && isWinner && window.confetti) {
            window.confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
          }
        }, [isOpen, isWinner]);

        if (!isOpen) return null;

        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/85 backdrop-blur-lg">
            <div className="relative w-full max-w-sm bg-slate-900 border-2 border-slate-700 rounded-3xl p-6 shadow-2xl text-center">
              <div className="font-black text-3xl mb-2">
                {isWinner ? <span className="text-amber-400">🎉 BINGO! YOU WIN!</span> : <span className="text-red-400">💔 GAME OVER</span>}
              </div>
              <p className="text-xs text-slate-300 mb-4">{isWinner ? 'You lit up all 5 B-I-N-G-O letters first!' : `${winnerName} completed 5 lines first.`}</p>

              <div className="flex flex-col gap-2 p-4 bg-slate-950/70 rounded-2xl border border-slate-800 text-xs mb-6">
                <div className="flex justify-between border-b border-slate-800 pb-2">
                  <span>Your Lines:</span>
                  <span className="font-bold text-amber-400">{myLinesCount} / 5</span>
                </div>
                <div className="flex justify-between border-b border-slate-800 pb-2">
                  <span>Opponent Lines:</span>
                  <span className="font-bold text-slate-400">{opponentLinesCount} / 5</span>
                </div>
                <div className="flex justify-between">
                  <span>Total Turns:</span>
                  <span className="font-bold text-white">{totalTurns}</span>
                </div>
              </div>

              <div className="flex flex-col gap-2">
                <button onClick={onRematch} className="w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black rounded-xl">
                  🔄 PLAY AGAIN / REMATCH
                </button>
                <button onClick={onMainMenu} className="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl text-xs">
                  🏠 MAIN MENU
                </button>
              </div>
            </div>
          </div>
        );
      }

      // --- 4. MAIN APP CONTAINER ---
      function App() {
        const [grid, setGrid] = useState(() => generateRandomGrid());
        const [selectedSetupIdx, setSelectedSetupIdx] = useState(0);
        const [gamePhase, setGamePhase] = useState('setup');
        const [gameMode, setGameMode] = useState('ai');
        const [isMyTurn, setIsMyTurn] = useState(true);
        const [crossedNumbers, setCrossedNumbers] = useState(new Set());
        const [lastCrossedNumber, setLastCrossedNumber] = useState(null);
        const [totalTurns, setTotalTurns] = useState(0);

        const [myReady, setMyReady] = useState(false);
        const [opponentReady, setOpponentReady] = useState(false);
        const [opponentName, setOpponentName] = useState('AI Bot');
        const [roomId, setRoomId] = useState(null);
        const [connectionStatus, setConnectionStatus] = useState('disconnected');
        const [isRoomModalOpen, setIsRoomModalOpen] = useState(false);
        const [initialRoomCode, setInitialRoomCode] = useState('');

        const [aiGrid, setAiGrid] = useState(() => generateRandomGrid());
        const [isMuted, setIsMuted] = useState(false);
        const [opponentLettersCount, setOpponentLettersCount] = useState(0);

        const [isWinner, setIsWinner] = useState(false);
        const [isGameOverModalOpen, setIsGameOverModalOpen] = useState(false);

        const peerRef = useRef(null);
        const connRef = useRef(null);
        const peerRoleRef = useRef(null);

        const myEval = evaluateGrid(grid, crossedNumbers);

        useEffect(() => {
          const params = new URLSearchParams(window.location.search);
          const roomParam = params.get('room');
          if (roomParam) {
            setInitialRoomCode(roomParam.toUpperCase());
            setIsRoomModalOpen(true);
            setGameMode('p2p');
          }
        }, []);

        const applyNumberCross = useCallback((num, wasMyMove) => {
          playCrossSound();
          setLastCrossedNumber(num);
          setTotalTurns(prev => prev + 1);

          setCrossedNumbers(prevSet => {
            const nextSet = new Set(prevSet);
            nextSet.add(num);

            const playerEval = evaluateGrid(grid, nextSet);
            let oppLinesCount = opponentLettersCount;
            if (gameMode === 'ai') {
              const aiEval = evaluateGrid(aiGrid, nextSet);
              oppLinesCount = aiEval.count;
              setOpponentLettersCount(oppLinesCount);
            }

            if (playerEval.isWin || oppLinesCount >= 5) {
              setGamePhase('gameover');
              const playerWon = playerEval.isWin;
              setIsWinner(playerWon);
              setIsGameOverModalOpen(true);
              if (playerWon) playVictorySound(); else playDefeatSound();
              return nextSet;
            }

            if (wasMyMove) {
              setIsMyTurn(false);
              if (gameMode === 'ai') {
                setTimeout(() => {
                  const aiChoice = getSmartAIMove(aiGrid, nextSet);
                  if (aiChoice) {
                    applyNumberCross(aiChoice, false);
                    setIsMyTurn(true);
                  }
                }, 800);
              } else if (connRef.current && connRef.current.open) {
                connRef.current.send({ type: 'MARK_NUMBER', value: num });
              }
            } else {
              setIsMyTurn(true);
            }

            return nextSet;
          });
        }, [grid, aiGrid, gameMode, opponentLettersCount]);

        const setupConnection = (connection, role) => {
          connRef.current = connection;
          peerRoleRef.current = role;

          connection.on('open', () => {
            setConnectionStatus('connected');
            setGameMode('p2p');
            setOpponentName(role === 'host' ? 'Guest Player' : 'Host Player');
          });

          connection.on('data', (data) => {
            if (!data || !data.type) return;
            if (data.type === 'READY') {
              setOpponentReady(true);
            } else if (data.type === 'START_GAME') {
              setGamePhase('playing');
              setIsMyTurn(data.currentTurn === peerRoleRef.current);
            } else if (data.type === 'MARK_NUMBER') {
              applyNumberCross(data.value, false);
            } else if (data.type === 'REMATCH_REQUEST') {
              resetGameForRematch();
            }
          });

          connection.on('close', () => {
            setConnectionStatus('disconnected');
            alert('Opponent disconnected.');
          });
        };

        const handleHostRoom = () => {
          if (peerRef.current) peerRef.current.destroy();
          const code = `BINGO-${Math.floor(1000 + Math.random() * 9000)}`;
          const peer = new Peer(code);
          peerRef.current = peer;

          peer.on('open', (id) => {
            setRoomId(id);
            setConnectionStatus('connecting');
          });

          peer.on('connection', (conn) => {
            setupConnection(conn, 'host');
          });
        };

        const handleJoinRoom = (code) => {
          if (peerRef.current) peerRef.current.destroy();
          const peer = new Peer();
          peerRef.current = peer;

          peer.on('open', () => {
            const conn = peer.connect(code, { reliable: true });
            setupConnection(conn, 'guest');
          });
        };

        const handleReadyToPlay = () => {
          playPopSound();
          setMyReady(true);

          if (gameMode === 'ai') {
            setAiGrid(generateRandomGrid());
            setOpponentReady(true);
            setGamePhase('playing');
            setIsMyTurn(true);
            setOpponentName('AI Bot');
            setCrossedNumbers(new Set());
            setOpponentLettersCount(0);
            setTotalTurns(0);
          } else {
            if (connRef.current && connRef.current.open) {
              connRef.current.send({ type: 'READY' });
            }
            if (opponentReady && peerRoleRef.current === 'host') {
              const firstTurn = Math.random() > 0.5 ? 'host' : 'guest';
              connRef.current.send({ type: 'START_GAME', currentTurn: firstTurn });
              setGamePhase('playing');
              setIsMyTurn(firstTurn === 'host');
              setCrossedNumbers(new Set());
              setOpponentLettersCount(0);
              setTotalTurns(0);
            }
          }
        };

        const resetGameForRematch = () => {
          setCrossedNumbers(new Set());
          setLastCrossedNumber(null);
          setGamePhase('setup');
          setMyReady(false);
          setOpponentReady(false);
          setIsGameOverModalOpen(false);
          setOpponentLettersCount(0);
        };

        return (
          <div className="min-h-screen bg-[#0b0f19] text-white flex flex-col items-center justify-between p-3 sm:p-6">
            <BingoHeader
              playerLetters={myEval.letters}
              opponentLettersCount={opponentLettersCount}
              isMyTurn={isMyTurn}
              gamePhase={gamePhase}
              gameMode={gameMode}
              opponentName={opponentName}
              isMuted={isMutedGlobal}
              onToggleMute={() => { isMutedGlobal = !isMutedGlobal; setIsMuted(isMutedGlobal); }}
              onOpenRoomModal={() => setIsRoomModalOpen(true)}
            />

            <main className="w-full flex-1 flex flex-col items-center justify-center my-2">
              <BingoGrid
                grid={grid}
                crossedNumbers={crossedNumbers}
                completedLines={myEval.completedLines}
                gamePhase={gamePhase}
                isMyTurn={isMyTurn}
                selectedSetupIdx={selectedSetupIdx}
                onCellClick={(idx, num) => {
                  if (gamePhase === 'setup') {
                    playPopSound();
                    setSelectedSetupIdx(idx);
                  } else if (isMyTurn && num && !crossedNumbers.has(num)) {
                    applyNumberCross(num, true);
                  }
                }}
                lastCrossedNumber={lastCrossedNumber}
              />

              {gamePhase === 'setup' && (
                <SetupPalette
                  grid={grid}
                  selectedIdx={selectedSetupIdx}
                  onRandomize={() => { playPopSound(); setGrid(generateRandomGrid()); setSelectedSetupIdx(0); }}
                  onClear={() => { playPopSound(); setGrid(Array(25).fill(null)); setSelectedSetupIdx(0); }}
                  onSelectNumberForCell={(num) => {
                    playPopSound();
                    const newGrid = [...grid];
                    const existingIdx = newGrid.indexOf(num);
                    if (existingIdx !== -1) newGrid[existingIdx] = null;
                    newGrid[selectedSetupIdx] = num;
                    setGrid(newGrid);
                    const nextEmpty = newGrid.findIndex((v, i) => i > selectedSetupIdx && v === null);
                    if (nextEmpty !== -1) setSelectedSetupIdx(nextEmpty);
                    else {
                      const firstEmpty = newGrid.findIndex(v => v === null);
                      if (firstEmpty !== -1) setSelectedSetupIdx(firstEmpty);
                    }
                  }}
                  onReady={handleReadyToPlay}
                  isReady={isValidGrid(grid)}
                  isWaitingForPeer={myReady && !opponentReady && gameMode === 'p2p'}
                />
              )}
            </main>

            <footer className="text-center text-[11px] text-slate-500 font-medium py-2">
              Serverless P2P WebRTC Bingo &bull; Hostable on GitHub Pages
            </footer>

            <RoomModal
              isOpen={isRoomModalOpen}
              onClose={() => setIsRoomModalOpen(false)}
              onSelectMode={(mode) => {
                setGameMode(mode);
                if (mode === 'ai') {
                  if (peerRef.current) peerRef.current.destroy();
                  setRoomId(null);
                  setConnectionStatus('disconnected');
                }
              }}
              roomId={roomId}
              connectionStatus={connectionStatus}
              onHostRoom={handleHostRoom}
              onJoinRoom={handleJoinRoom}
              initialRoomCode={initialRoomCode}
            />

            <GameOverModal
              isOpen={isGameOverModalOpen}
              isWinner={isWinner}
              winnerName={isWinner ? 'You' : opponentName}
              myLinesCount={myEval.count}
              opponentLinesCount={opponentLettersCount}
              totalTurns={totalTurns}
              onRematch={() => {
                resetGameForRematch();
                if (gameMode === 'p2p' && connRef.current) connRef.current.send({ type: 'REMATCH_REQUEST' });
              }}
              onMainMenu={() => {
                setIsGameOverModalOpen(false);
                setGamePhase('setup');
                setIsRoomModalOpen(true);
              }}
            />
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>

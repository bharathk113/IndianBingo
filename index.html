<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no" />
    <title>Indian 5x5 Bingo - P2P Multiplayer Game</title>
    <meta name="description" content="Serverless, peer-to-peer (P2P) mobile-first web app of the traditional Indian 5x5 paper-and-pen Bingo game." />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>" />

    <!-- Google Fonts: Outfit & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Outfit', 'sans-serif'],
            },
            colors: {
              bingo: {
                bg: '#0b0f19',
                card: '#151c2e',
                accent: '#f59e0b',
                glow: '#fbbf24',
                crossed: '#ef4444',
                active: '#10b981',
              }
            },
            animation: {
              'stamp': 'stamp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
              'pop': 'pop 0.2s ease-out forwards',
            },
            keyframes: {
              stamp: {
                '0%': { transform: 'scale(2) rotate(-10deg)', opacity: '0' },
                '100%': { transform: 'scale(1) rotate(0deg)', opacity: '1' },
              },
              pop: {
                '0%': { transform: 'scale(0.8)' },
                '50%': { transform: 'scale(1.15)' },
                '100%': { transform: 'scale(1)' },
              }
            }
          }
        }
      }
    </script>

    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

    <!-- PeerJS WebRTC CDN -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

    <!-- React 18 & ReactDOM 18 CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

    <!-- Babel Standalone for in-browser JSX parsing -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden; /* Prevent scrolling for the single-screen view */
        background-color: #0b0f19;
        font-family: 'Outfit', sans-serif;
        color: #f3f4f6;
        margin: 0;
        padding: 0;
      }
      .glass-panel {
        background: rgba(21, 28, 46, 0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .text-glow-amber {
        text-shadow: 0 0 10px rgba(245, 158, 11, 0.8), 0 0 20px rgba(245, 158, 11, 0.4);
      }
      /* Ensure grid maintains aspect ratio but stays within bounds */
      .bingo-grid-container {
        aspect-ratio: 1 / 1;
        max-width: 100%;
        max-height: 100%;
        height: 100%;
        margin: 0 auto;
      }
    </style>
  </head>
  <body class="antialiased select-none">
    <div id="root" class="w-full h-full"></div>

    <script type="text/babel">
      const { useState, useEffect, useCallback, useRef } = React;

      // STUN Server Config
      const PEER_CONFIG = {
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:global.stun.twilio.com:3478' }
          ]
        }
      };

      // --- 1. GAME ENGINE & RULES ---
      const BINGO_LETTERS = ['B', 'I', 'N', 'G', 'O'];

      const WINNING_LINE_PATTERNS = [
        { id: 'row-0', indices: [0, 1, 2, 3, 4], type: 'row', index: 0 },
        { id: 'row-1', indices: [5, 6, 7, 8, 9], type: 'row', index: 1 },
        { id: 'row-2', indices: [10, 11, 12, 13, 14], type: 'row', index: 2 },
        { id: 'row-3', indices: [15, 16, 17, 18, 19], type: 'row', index: 3 },
        { id: 'row-4', indices: [20, 21, 22, 23, 24], type: 'row', index: 4 },
        { id: 'col-0', indices: [0, 5, 10, 15, 20], type: 'col', index: 0 },
        { id: 'col-1', indices: [1, 6, 11, 16, 21], type: 'col', index: 1 },
        { id: 'col-2', indices: [2, 7, 12, 17, 22], type: 'col', index: 2 },
        { id: 'col-3', indices: [3, 8, 13, 18, 23], type: 'col', index: 3 },
        { id: 'col-4', indices: [4, 9, 14, 19, 24], type: 'col', index: 4 },
        { id: 'diag-main', indices: [0, 6, 12, 18, 24], type: 'diag', index: 0 },
        { id: 'diag-anti', indices: [4, 8, 12, 16, 20], type: 'diag', index: 1 },
      ];

      function generateRandomGrid() {
        const numbers = Array.from({ length: 25 }, (_, i) => i + 1);
        for (let i = numbers.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [numbers[i], numbers[j]] = [numbers[j], numbers[i]];
        }
        return numbers;
      }

      function isValidGrid(grid) {
        if (!Array.isArray(grid) || grid.length !== 25) return false;
        const numSet = new Set(grid.filter(n => n !== null && n !== undefined && n >= 1 && n <= 25));
        return numSet.size === 25;
      }

      function evaluateGrid(grid, crossedNumbers) {
        if (!grid || grid.length !== 25) return { completedLines: [], count: 0, letters: [], isWin: false };
        const crossedSet = crossedNumbers instanceof Set ? crossedNumbers : new Set(crossedNumbers);
        const completedLines = WINNING_LINE_PATTERNS.filter(pattern =>
          pattern.indices.every(idx => grid[idx] && crossedSet.has(grid[idx]))
        );
        const count = completedLines.length;
        const unlockedLetters = BINGO_LETTERS.slice(0, Math.min(5, count));
        return { completedLines, count, letters: unlockedLetters, isWin: count >= 5 };
      }

      function getSmartAIMove(aiGrid, crossedNumbers) {
        const crossedSet = crossedNumbers instanceof Set ? crossedNumbers : new Set(crossedNumbers);
        const uncrossed = aiGrid.map((num, idx) => (num && !crossedSet.has(num) ? { num, idx } : null)).filter(Boolean);
        if (uncrossed.length === 0) return null;

        let bestScore = -1, bestMove = uncrossed[0].num;
        for (const { num, idx } of uncrossed) {
          let score = 0;
          for (const pattern of WINNING_LINE_PATTERNS) {
            if (pattern.indices.includes(idx)) {
              const crossedInLine = pattern.indices.filter(i => crossedSet.has(aiGrid[i])).length;
              score += Math.pow(2, crossedInLine);
            }
          }
          if (score > bestScore) { bestScore = score; bestMove = num; }
        }
        return bestMove;
      }

      // --- 2. AUDIO SYNTHESIZER ---
      let audioCtx = null, isMutedGlobal = false;
      function getAudioContext() {
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) audioCtx = new AC();
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        return audioCtx;
      }

      function playSound(type) {
        if (isMutedGlobal) return;
        const ctx = getAudioContext();
        if (!ctx) return;
        try {
          if (type === 'pop') {
            const osc = ctx.createOscillator(), gain = ctx.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(400, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.05);
            gain.gain.setValueAtTime(0.15, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(); osc.stop(ctx.currentTime + 0.05);
          } else if (type === 'cross') {
            const osc = ctx.createOscillator(), gain = ctx.createGain();
            osc.type = 'triangle'; osc.frequency.setValueAtTime(150, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.3, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.12);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(); osc.stop(ctx.currentTime + 0.12);
          } else if (type === 'chime') {
            [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
              const osc = ctx.createOscillator(), gain = ctx.createGain();
              osc.type = 'sine'; osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.06);
              gain.gain.setValueAtTime(0.2, ctx.currentTime + idx * 0.06); gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.06 + 0.2);
              osc.connect(gain); gain.connect(ctx.destination);
              osc.start(ctx.currentTime + idx * 0.06); osc.stop(ctx.currentTime + idx * 0.06 + 0.2);
            });
          } else if (type === 'victory') {
            [{f: 523.25, d: 0.15, delay: 0}, {f: 659.25, d: 0.15, delay: 0.15}, {f: 783.99, d: 0.15, delay: 0.3}, {f: 1046.5, d: 0.5, delay: 0.45}].forEach(({f,d,delay}) => {
              const osc = ctx.createOscillator(), gain = ctx.createGain();
              osc.type = 'triangle'; osc.frequency.setValueAtTime(f, ctx.currentTime + delay);
              gain.gain.setValueAtTime(0.3, ctx.currentTime + delay); gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + d);
              osc.connect(gain); gain.connect(ctx.destination);
              osc.start(ctx.currentTime + delay); osc.stop(ctx.currentTime + delay + d);
            });
          } else if (type === 'defeat') {
            [400, 350, 300, 250].forEach((freq, idx) => {
              const osc = ctx.createOscillator(), gain = ctx.createGain();
              osc.type = 'sawtooth'; osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.12);
              gain.gain.setValueAtTime(0.15, ctx.currentTime + idx * 0.12); gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.12 + 0.2);
              osc.connect(gain); gain.connect(ctx.destination);
              osc.start(ctx.currentTime + idx * 0.12); osc.stop(ctx.currentTime + idx * 0.12 + 0.2);
            });
          }
        } catch(e){}
      }

      // --- 3. COMPONENTS ---
      function BingoHeader({ playerLetters, opponentLettersCount, isMyTurn, gamePhase, gameMode, opponentName, isMuted, onToggleMute, onOpenRoomModal }) {
        return (
          <div className="w-full max-w-lg mx-auto flex flex-col gap-2 p-2 sm:p-3 glass-panel rounded-xl border border-slate-700/50 shadow-md shrink-0">
            <div className="flex items-center justify-between border-b border-slate-700/40 pb-2">
              <div className="flex items-center gap-2">
                <div className="w-7 h-7 sm:w-8 sm:h-8 rounded-lg bg-gradient-to-tr from-amber-500 to-yellow-300 flex items-center justify-center font-black text-slate-950 text-base sm:text-lg shadow-lg">
                  🎯
                </div>
                <div className="flex flex-col">
                  <h1 className="font-extrabold text-base sm:text-lg text-white leading-none">INDIAN <span className="text-amber-400">BINGO</span></h1>
                  <span className="text-[9px] sm:text-[10px] text-slate-400 font-medium uppercase tracking-wider">5x5 Paper & Pen P2P</span>
                </div>
              </div>
              <div className="flex items-center gap-1 sm:gap-2">
                <button onClick={onOpenRoomModal} className="flex items-center gap-1 px-2 py-1 sm:px-3 sm:py-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700/80 border border-slate-700 text-[10px] sm:text-xs font-semibold text-slate-300 transition">
                  {gameMode === 'ai' ? '🤖 VS AI' : '📡 P2P Room'}
                </button>
                <button onClick={onToggleMute} className="p-1 sm:p-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700/80 border border-slate-700 text-slate-300 hover:text-white transition text-xs sm:text-sm">
                  {isMuted ? '🔇' : '🔊'}
                </button>
              </div>
            </div>

            <div className="flex justify-between items-center">
              <div className="flex items-center gap-1 sm:gap-2 w-full justify-center">
                {BINGO_LETTERS.map((letter) => {
                  const isUnlocked = playerLetters.includes(letter);
                  return (
                    <div key={letter} className={`relative flex-1 max-w-[48px] sm:max-w-[56px] aspect-square rounded-lg sm:rounded-xl flex items-center justify-center font-black text-xl sm:text-2xl transition-all duration-300 ${isUnlocked ? 'bg-gradient-to-b from-amber-400 via-amber-500 to-amber-600 text-slate-950 scale-105 shadow-md shadow-amber-500/50 ring-2 ring-amber-300 animate-pop' : 'bg-slate-800/60 text-slate-600 border border-slate-700/50'}`}>
                      <span>{letter}</span>
                    </div>
                  );
                })}
              </div>
            </div>

            {gamePhase === 'playing' && (
              <div className="flex items-center justify-between bg-slate-900/60 px-2 py-1.5 rounded-lg border border-slate-800/80 mt-1">
                <div className="flex items-center gap-1.5">
                  <div className={`w-2 h-2 rounded-full ${isMyTurn ? 'bg-emerald-400 animate-ping' : 'bg-slate-500'}`} />
                  <span className={`font-bold text-[11px] sm:text-xs ${isMyTurn ? 'text-emerald-400' : 'text-slate-400'}`}>
                    {isMyTurn ? '👉 YOUR TURN!' : `⏳ ${opponentName}'s turn...`}
                  </span>
                </div>
                <div className="flex items-center gap-1 text-slate-400">
                  <span className="text-[10px] font-medium hidden sm:inline">{opponentName}:</span>
                  <div className="flex gap-0.5 font-extrabold text-[10px] sm:text-xs tracking-widest">
                    {BINGO_LETTERS.map((letter, idx) => (
                      <span key={letter} className={idx < opponentLettersCount ? 'text-amber-400' : 'text-slate-600'}>{letter}</span>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      function BingoGrid({ grid, crossedNumbers, completedLines, gamePhase, isMyTurn, selectedSetupIdx, onCellClick, lastCrossedNumber }) {
        const crossedSet = crossedNumbers instanceof Set ? crossedNumbers : new Set(crossedNumbers);

        const getLineCoords = (pattern) => {
          if (pattern.type === 'row') return { x1: '4%', y1: `${(pattern.index + 0.5) * 20}%`, x2: '96%', y2: `${(pattern.index + 0.5) * 20}%` };
          if (pattern.type === 'col') return { x1: `${(pattern.index + 0.5) * 20}%`, y1: '4%', x2: `${(pattern.index + 0.5) * 20}%`, y2: '96%' };
          if (pattern.id === 'diag-main') return { x1: '6%', y1: '6%', x2: '94%', y2: '94%' };
          if (pattern.id === 'diag-anti') return { x1: '94%', y1: '6%', x2: '6%', y2: '94%' };
          return { x1: '0', y1: '0', x2: '0', y2: '0' };
        };

        return (
          <div className="bingo-grid-container relative w-full bg-slate-900/90 rounded-2xl border-2 border-slate-800 shadow-xl overflow-hidden p-1.5 sm:p-2">
            <div className="grid grid-cols-5 grid-rows-5 gap-1 w-full h-full">
              {Array.from({ length: 25 }).map((_, idx) => {
                const val = grid[idx];
                const isCrossed = val && crossedSet.has(val);
                const isSelected = gamePhase === 'setup' && selectedSetupIdx === idx;
                const isJustCrossed = val && lastCrossedNumber === val;

                return (
                  <button
                    key={idx}
                    onClick={() => onCellClick(idx, val)}
                    disabled={gamePhase === 'playing' && (!isMyTurn || isCrossed || !val)}
                    className={`relative flex items-center justify-center rounded-lg sm:rounded-xl font-black text-lg sm:text-2xl transition-all duration-200 select-none overflow-hidden ${
                      gamePhase === 'setup'
                        ? isSelected ? 'bg-amber-500 text-slate-950 ring-2 ring-amber-300 scale-95 z-10 shadow-lg'
                        : val ? 'bg-slate-800 text-white border border-slate-700/80' : 'bg-slate-950/80 text-slate-600 border border-dashed border-slate-700'
                        : isCrossed ? 'bg-slate-950/90 text-slate-500 border border-slate-900 shadow-inner'
                        : isMyTurn && val ? 'bg-slate-800 hover:bg-amber-500/20 text-white border border-slate-700 hover:scale-[1.03]'
                        : 'bg-slate-800/80 text-slate-300 border border-slate-700/50'
                    }`}
                  >
                    <span className={`relative z-10 ${isCrossed ? 'line-through opacity-60' : ''}`}>
                      {val || idx + 1}
                    </span>
                    {isCrossed && (
                      <div className={`absolute inset-0 flex items-center justify-center pointer-events-none z-20 ${isJustCrossed ? 'animate-stamp' : ''}`}>
                        <span className="font-black text-3xl sm:text-5xl text-red-500/90 drop-shadow-[0_0_12px_rgba(239,68,68,0.8)]">✕</span>
                      </div>
                    )}
                  </button>
                );
              })}
            </div>
            {completedLines.length > 0 && (
              <svg className="absolute inset-0 w-full h-full pointer-events-none z-30 p-1.5 sm:p-2">
                <defs>
                  <linearGradient id="lineGlow" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stopColor="#f59e0b" /><stop offset="50%" stopColor="#fbbf24" /><stop offset="100%" stopColor="#10b981" />
                  </linearGradient>
                </defs>
                {completedLines.map((pattern) => {
                  const coords = getLineCoords(pattern);
                  return <line key={pattern.id} {...coords} stroke="url(#lineGlow)" strokeWidth="6" strokeLinecap="round" className="opacity-90 animate-pulse" />;
                })}
              </svg>
            )}
          </div>
        );
      }

      function SetupPalette({ grid, selectedIdx, onRandomize, onClear, onSelectNumberForCell, onReady, isReady, isWaitingForPeer }) {
        const placed = new Set(grid.filter(n => n));
        const remaining = Array.from({ length: 25 }, (_, i) => i + 1).filter(n => !placed.has(n));
        const isComplete = isValidGrid(grid);

        return (
          <div className="w-full max-w-lg mx-auto flex flex-col gap-2 p-3 glass-panel rounded-xl border border-slate-700/50 shadow-md shrink-0 mt-2">
            <div className="flex justify-between items-center border-b border-slate-700/40 pb-2">
              <div>
                <h3 className="font-bold text-xs sm:text-sm text-white">Setup: {placed.size}/25 placed</h3>
              </div>
              <div className="flex gap-2">
                <button onClick={onRandomize} className="px-2 py-1 rounded bg-amber-500/20 text-amber-300 text-[10px] sm:text-xs font-semibold">🎲 Random</button>
                <button onClick={onClear} className="px-2 py-1 rounded bg-slate-800 text-slate-300 text-[10px] sm:text-xs font-semibold">🗑️ Clear</button>
              </div>
            </div>
            {!isComplete && (
              <div className="flex flex-col gap-1 overflow-y-auto max-h-[25vh]">
                <span className="text-[9px] sm:text-[10px] font-semibold text-slate-400 uppercase">Tap for slot #{selectedIdx + 1}:</span>
                <div className="flex flex-wrap gap-1">
                  {remaining.map(num => (
                    <button key={num} onClick={() => onSelectNumberForCell(num)} className="w-7 h-7 sm:w-8 sm:h-8 rounded bg-slate-800 text-slate-200 font-bold text-xs sm:text-sm hover:bg-amber-500 hover:text-black">
                      {num}
                    </button>
                  ))}
                </div>
              </div>
            )}
            <button onClick={onReady} disabled={!isComplete || isWaitingForPeer} className={`w-full py-2.5 rounded-lg font-extrabold text-xs sm:text-sm shadow-md transition-all ${
              isWaitingForPeer ? 'bg-amber-500/30 text-amber-300' : isComplete ? 'bg-emerald-500 text-slate-950' : 'bg-slate-800 text-slate-500'
            }`}>
              {isWaitingForPeer ? 'WAITING FOR HOST/GUEST...' : isReady ? '▶ START GAME' : 'READY (FILL 25 SLOTS)'}
            </button>
          </div>
        );
      }

      function RoomModal({ isOpen, onClose, onSelectMode, roomId, connectionStatus, onHostRoom, onJoinRoom, initialRoomCode }) {
        const [activeTab, setActiveTab] = useState('host');
        const [joinCodeInput, setJoinCodeInput] = useState(initialRoomCode || '');
        const [copied, setCopied] = useState(false);

        useEffect(() => {
          if (initialRoomCode) { setJoinCodeInput(initialRoomCode); setActiveTab('join'); }
        }, [initialRoomCode]);

        if (!isOpen) return null;
        
        const copyLink = () => {
          if (!roomId) return;
          navigator.clipboard.writeText(`${window.location.origin}${window.location.pathname}?room=${roomId}`);
          setCopied(true); setTimeout(() => setCopied(false), 2000);
        };

        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
            <div className="relative w-full max-w-sm bg-slate-900 border border-slate-700/80 rounded-2xl p-5 shadow-2xl">
              <button onClick={onClose} className="absolute top-3 right-4 text-slate-400 hover:text-white font-bold text-lg">✕</button>
              <h2 className="font-extrabold text-lg text-white mb-4">Multiplayer Mode</h2>
              <div className="grid grid-cols-3 gap-1 bg-slate-950/70 p-1 rounded-lg border border-slate-800 mb-5">
                <button onClick={() => setActiveTab('host')} className={`py-1.5 text-xs font-bold rounded ${activeTab === 'host' ? 'bg-amber-500 text-slate-950' : 'text-slate-400'}`}>Host</button>
                <button onClick={() => setActiveTab('join')} className={`py-1.5 text-xs font-bold rounded ${activeTab === 'join' ? 'bg-amber-500 text-slate-950' : 'text-slate-400'}`}>Join</button>
                <button onClick={() => setActiveTab('ai')} className={`py-1.5 text-xs font-bold rounded ${activeTab === 'ai' ? 'bg-amber-500 text-slate-950' : 'text-slate-400'}`}>VS AI</button>
              </div>

              {activeTab === 'host' && (
                <div>
                  {!roomId ? (
                    <button onClick={onHostRoom} className="w-full py-3 rounded-lg bg-amber-500 text-slate-950 font-black text-sm">CREATE ROOM</button>
                  ) : (
                    <div className="flex flex-col gap-3 p-3 bg-slate-950/60 rounded-xl border border-slate-800 text-center">
                      <span className="text-[10px] text-slate-400 font-semibold uppercase">Room Code</span>
                      <div className="font-black text-2xl text-amber-400 uppercase">{roomId}</div>
                      <p className={`text-[11px] font-semibold ${connectionStatus === 'connected' ? 'text-emerald-400' : 'text-amber-400 animate-pulse'}`}>
                        {connectionStatus === 'connected' ? '✓ Peer Connected!' : '⏳ Waiting for guest to join...'}
                      </p>
                      <button onClick={copyLink} className="py-2 bg-slate-800 text-xs font-bold rounded border border-slate-700 text-slate-200">
                        {copied ? '✓ Copied!' : '📋 Copy Link'}
                      </button>
                    </div>
                  )}
                </div>
              )}

              {activeTab === 'join' && (
                <form onSubmit={(e) => { e.preventDefault(); if (joinCodeInput.trim()) onJoinRoom(joinCodeInput); }} className="flex flex-col gap-3">
                  <input type="text" placeholder="Enter Room Code (e.g. bingo-4921)" value={joinCodeInput} onChange={e => setJoinCodeInput(e.target.value)} className="w-full px-3 py-2.5 bg-slate-950 border border-slate-700 rounded-lg text-amber-400 font-black text-center uppercase" />
                  <button type="submit" disabled={!joinCodeInput.trim() || connectionStatus === 'connecting'} className="w-full py-3 bg-emerald-500 text-slate-950 font-black rounded-lg disabled:opacity-50">
                    {connectionStatus === 'connecting' ? 'CONNECTING...' : 'JOIN GAME'}
                  </button>
                  {connectionStatus === 'error' && <p className="text-xs text-red-400 text-center font-semibold">Failed to connect. Check code.</p>}
                </form>
              )}

              {activeTab === 'ai' && (
                <div className="text-center">
                  <p className="text-xs text-slate-400 mb-3">Play offline against the smart computer AI bot.</p>
                  <button onClick={() => { onSelectMode('ai'); onClose(); }} className="w-full py-3 bg-amber-500 text-slate-950 font-black rounded-lg">START VS AI</button>
                </div>
              )}
            </div>
          </div>
        );
      }

      function GameOverModal({ isOpen, isWinner, winnerName, myLinesCount, opponentLinesCount, totalTurns, onRematch, onMainMenu }) {
        useEffect(() => { if (isOpen && isWinner && window.confetti) window.confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } }); }, [isOpen, isWinner]);
        if (!isOpen) return null;
        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/85 backdrop-blur-lg">
            <div className="relative w-full max-w-xs bg-slate-900 border-2 border-slate-700 rounded-2xl p-5 text-center shadow-2xl">
              <div className="font-black text-2xl mb-1">{isWinner ? <span className="text-amber-400">🎉 BINGO!</span> : <span className="text-red-400">💔 GAME OVER</span>}</div>
              <p className="text-[11px] text-slate-300 mb-4">{isWinner ? 'You won!' : `${winnerName} won.`}</p>
              <div className="flex flex-col gap-1.5 p-3 bg-slate-950/70 rounded-xl border border-slate-800 text-xs mb-4">
                <div className="flex justify-between border-b border-slate-800 pb-1"><span>Your Lines:</span><span className="font-bold text-amber-400">{myLinesCount}/5</span></div>
                <div className="flex justify-between border-b border-slate-800 pb-1"><span>Opponent Lines:</span><span className="font-bold text-slate-400">{opponentLinesCount}/5</span></div>
                <div className="flex justify-between"><span>Total Turns:</span><span className="font-bold text-white">{totalTurns}</span></div>
              </div>
              <div className="flex flex-col gap-2">
                <button onClick={onRematch} className="w-full py-2.5 bg-emerald-500 text-slate-950 font-black rounded-lg text-xs">🔄 PLAY AGAIN</button>
                <button onClick={onMainMenu} className="w-full py-2 bg-slate-800 text-slate-300 font-bold rounded-lg text-[11px]">🏠 MAIN MENU</button>
              </div>
            </div>
          </div>
        );
      }

      // --- 4. MAIN APP ---
      function App() {
        const [grid, setGrid] = useState(() => generateRandomGrid());
        const [selectedSetupIdx, setSelectedSetupIdx] = useState(0);
        const [gamePhase, setGamePhase] = useState('setup');
        const [gameMode, setGameMode] = useState('ai');
        const [isMyTurn, setIsMyTurn] = useState(true);
        const [crossedNumbers, setCrossedNumbers] = useState(new Set());
        const [lastCrossedNumber, setLastCrossedNumber] = useState(null);
        const [totalTurns, setTotalTurns] = useState(0);

        const [myReady, setMyReady] = useState(false);
        const [opponentReady, setOpponentReady] = useState(false);
        const [opponentName, setOpponentName] = useState('AI Bot');
        const [roomId, setRoomId] = useState(null);
        const [connectionStatus, setConnectionStatus] = useState('disconnected');
        const [isRoomModalOpen, setIsRoomModalOpen] = useState(false);
        const [initialRoomCode, setInitialRoomCode] = useState('');

        const [aiGrid, setAiGrid] = useState(() => generateRandomGrid());
        const [isMuted, setIsMuted] = useState(false);
        const [opponentLettersCount, setOpponentLettersCount] = useState(0);
        const [isWinner, setIsWinner] = useState(false);
        const [isGameOverModalOpen, setIsGameOverModalOpen] = useState(false);

        const peerRef = useRef(null);
        const connRef = useRef(null);
        const peerRoleRef = useRef(null);
        const myEval = evaluateGrid(grid, crossedNumbers);

        useEffect(() => {
          const params = new URLSearchParams(window.location.search);
          const roomParam = params.get('room');
          if (roomParam) {
            setInitialRoomCode(roomParam.toLowerCase());
            setIsRoomModalOpen(true);
            setGameMode('p2p');
          }
        }, []);

        const applyNumberCross = useCallback((num, wasMyMove) => {
          playSound('cross'); setLastCrossedNumber(num); setTotalTurns(p => p + 1);
          setCrossedNumbers(prev => {
            const nextSet = new Set(prev); nextSet.add(num);
            const playerEval = evaluateGrid(grid, nextSet);
            let oppLinesCount = opponentLettersCount;
            if (gameMode === 'ai') {
              oppLinesCount = evaluateGrid(aiGrid, nextSet).count;
              setOpponentLettersCount(oppLinesCount);
            }

            if (playerEval.isWin || oppLinesCount >= 5) {
              setGamePhase('gameover');
              const playerWon = playerEval.isWin;
              setIsWinner(playerWon); setIsGameOverModalOpen(true);
              playSound(playerWon ? 'victory' : 'defeat');
              return nextSet;
            }

            if (wasMyMove) {
              setIsMyTurn(false);
              if (gameMode === 'ai') {
                setTimeout(() => {
                  const aiChoice = getSmartAIMove(aiGrid, nextSet);
                  if (aiChoice) { applyNumberCross(aiChoice, false); setIsMyTurn(true); }
                }, 800);
              } else if (connRef.current && connRef.current.open) {
                connRef.current.send({ type: 'MARK_NUMBER', value: num });
              }
            } else {
              setIsMyTurn(true);
            }
            return nextSet;
          });
        }, [grid, aiGrid, gameMode, opponentLettersCount]);

        const setupConnection = (connection, role) => {
          connRef.current = connection;
          peerRoleRef.current = role;
          let hasOpened = false;

          const onOpen = () => {
            if (hasOpened) return;
            hasOpened = true;
            setConnectionStatus('connected');
            setGameMode('p2p');
            setOpponentName(role === 'host' ? 'Guest' : 'Host');
            setIsRoomModalOpen(false); // Auto close modal on connect!
          };

          // PeerJS data connections sometimes trigger 'open' or are already open
          if (connection.open) onOpen();
          else connection.on('open', onOpen);

          connection.on('data', (data) => {
            if (!data) return;
            if (data.type === 'READY') setOpponentReady(true);
            else if (data.type === 'START_GAME') {
              setGamePhase('playing');
              setIsMyTurn(data.currentTurn === peerRoleRef.current);
            }
            else if (data.type === 'MARK_NUMBER') applyNumberCross(data.value, false);
            else if (data.type === 'REMATCH_REQUEST') resetGameForRematch();
          });

          connection.on('close', () => {
            if (hasOpened) {
              setConnectionStatus('disconnected');
              alert('Opponent disconnected.');
            }
          });
          
          connection.on('error', (err) => {
            console.error('Connection error:', err);
            setConnectionStatus('error');
          });
        };

        const handleHostRoom = () => {
          if (peerRef.current) { try { peerRef.current.destroy(); } catch(e){} }
          const cleanCode = `bingo-${Math.floor(1000 + Math.random() * 9000)}`;
          const peer = new Peer(cleanCode, PEER_CONFIG);
          peerRef.current = peer;

          peer.on('open', (id) => {
            setRoomId(id); setConnectionStatus('connecting'); peerRoleRef.current = 'host';
          });
          peer.on('connection', (conn) => { setupConnection(conn, 'host'); });
          peer.on('error', (err) => {
            if (err.type === 'unavailable-id') handleHostRoom(); // retry
          });
        };

        const handleJoinRoom = (code) => {
          if (peerRef.current) { try { peerRef.current.destroy(); } catch(e){} }
          const cleanCode = code.trim().toLowerCase();
          
          // CRITICAL FIX: new Peer(options) instead of interpreting config as string ID
          const peer = new Peer(undefined, PEER_CONFIG);
          peerRef.current = peer;
          setConnectionStatus('connecting');

          peer.on('open', () => {
            const conn = peer.connect(cleanCode, { reliable: true });
            setupConnection(conn, 'guest');
          });

          peer.on('error', (err) => {
            console.error('Join peer error:', err);
            setConnectionStatus('error');
          });
        };

        const handleReadyToPlay = () => {
          playSound('pop'); setMyReady(true);
          if (gameMode === 'ai') {
            setAiGrid(generateRandomGrid()); setOpponentReady(true); setGamePhase('playing');
            setIsMyTurn(true); setOpponentName('AI Bot'); setCrossedNumbers(new Set());
            setOpponentLettersCount(0); setTotalTurns(0);
          } else {
            if (connRef.current && connRef.current.open) connRef.current.send({ type: 'READY' });
            if (opponentReady && peerRoleRef.current === 'host') {
              const firstTurn = Math.random() > 0.5 ? 'host' : 'guest';
              connRef.current.send({ type: 'START_GAME', currentTurn: firstTurn });
              setGamePhase('playing'); setIsMyTurn(firstTurn === 'host');
              setCrossedNumbers(new Set()); setOpponentLettersCount(0); setTotalTurns(0);
            }
          }
        };

        const resetGameForRematch = () => {
          setCrossedNumbers(new Set()); setLastCrossedNumber(null); setGamePhase('setup');
          setMyReady(false); setOpponentReady(false); setIsGameOverModalOpen(false); setOpponentLettersCount(0);
        };

        return (
          <div className="w-full h-full flex flex-col items-center p-2 sm:p-4">
            <BingoHeader playerLetters={myEval.letters} opponentLettersCount={opponentLettersCount} isMyTurn={isMyTurn} gamePhase={gamePhase} gameMode={gameMode} opponentName={opponentName} isMuted={isMutedGlobal} onToggleMute={() => { isMutedGlobal = !isMutedGlobal; setIsMuted(isMutedGlobal); }} onOpenRoomModal={() => setIsRoomModalOpen(true)} />
            
            <main className="w-full flex-1 flex flex-col items-center justify-center min-h-0">
              <div className="w-full h-full max-w-lg flex flex-col justify-center gap-1 sm:gap-2">
                <div className="w-full flex-1 min-h-0 flex items-center justify-center">
                  <BingoGrid grid={grid} crossedNumbers={crossedNumbers} completedLines={myEval.completedLines} gamePhase={gamePhase} isMyTurn={isMyTurn} selectedSetupIdx={selectedSetupIdx} onCellClick={(idx, num) => {
                    if (gamePhase === 'setup') { playSound('pop'); setSelectedSetupIdx(idx); }
                    else if (isMyTurn && num && !crossedNumbers.has(num)) applyNumberCross(num, true);
                  }} lastCrossedNumber={lastCrossedNumber} />
                </div>
                {gamePhase === 'setup' && (
                  <SetupPalette grid={grid} selectedIdx={selectedSetupIdx} onRandomize={() => { playSound('pop'); setGrid(generateRandomGrid()); setSelectedSetupIdx(0); }} onClear={() => { playSound('pop'); setGrid(Array(25).fill(null)); setSelectedSetupIdx(0); }} onSelectNumberForCell={(num) => {
                    playSound('pop'); const newGrid = [...grid]; const existingIdx = newGrid.indexOf(num);
                    if (existingIdx !== -1) newGrid[existingIdx] = null; newGrid[selectedSetupIdx] = num; setGrid(newGrid);
                    const nextEmpty = newGrid.findIndex((v, i) => i > selectedSetupIdx && v === null);
                    if (nextEmpty !== -1) setSelectedSetupIdx(nextEmpty); else { const firstEmpty = newGrid.findIndex(v => v === null); if (firstEmpty !== -1) setSelectedSetupIdx(firstEmpty); }
                  }} onReady={handleReadyToPlay} isReady={isValidGrid(grid)} isWaitingForPeer={myReady && !opponentReady && gameMode === 'p2p'} />
                )}
              </div>
            </main>
            
            <footer className="text-center text-[9px] sm:text-[10px] text-slate-500 font-medium pb-1 shrink-0 mt-2">
              Serverless P2P WebRTC Bingo &bull; Hosted on GitHub Pages
            </footer>

            <RoomModal isOpen={isRoomModalOpen} onClose={() => setIsRoomModalOpen(false)} onSelectMode={(mode) => {
              setGameMode(mode); if (mode === 'ai') { if (peerRef.current) peerRef.current.destroy(); setRoomId(null); setConnectionStatus('disconnected'); }
            }} roomId={roomId} connectionStatus={connectionStatus} onHostRoom={handleHostRoom} onJoinRoom={handleJoinRoom} initialRoomCode={initialRoomCode} />

            <GameOverModal isOpen={isGameOverModalOpen} isWinner={isWinner} winnerName={isWinner ? 'You' : opponentName} myLinesCount={myEval.count} opponentLinesCount={opponentLettersCount} totalTurns={totalTurns} onRematch={() => {
              resetGameForRematch(); if (gameMode === 'p2p' && connRef.current) connRef.current.send({ type: 'REMATCH_REQUEST' });
            }} onMainMenu={() => { setIsGameOverModalOpen(false); setGamePhase('setup'); setIsRoomModalOpen(true); }} />
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
